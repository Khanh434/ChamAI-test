<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>ChamAI - Nhận diện bài thi trắc nghiệm</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-container">
      <!-- 1. Header (Fixed 52px) -->
      <header class="app-header">
        <div class="brand">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <span class="brand-title">ChamAI</span>
        </div>

        <div id="status-badge" class="status-pill idle">
          <span id="status-text">Chưa nạp</span>
        </div>

        <button id="btn-settings" class="icon-btn" aria-label="Cài đặt CDN" title="Cài đặt CDN">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>

      <!-- 2. Main Stage (Flex 1 Scroll-Free) -->
      <main class="stage-container">
        <!-- Idle Stage -->
        <section id="idle-stage" class="stage-idle">
          <div class="viewfinder-box">
            <div class="viewfinder-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </div>
            <p class="viewfinder-title">Chụp hoặc Chọn bài thi</p>
            <p class="viewfinder-desc">Căn chỉnh bài thi thẳng góc đủ sáng để mô hình AI nhận diện chính xác nhất.</p>
          </div>
        </section>

        <!-- Loading Stage -->
        <section id="loading-stage" class="stage-loading" hidden>
          <div class="spinner"></div>
          <div class="progress-track">
            <div id="progress-bar" class="progress-fill"></div>
          </div>
          <p id="progress-text" class="progress-text">Đang tải tài nguyên...</p>
        </section>

        <!-- Result Stage -->
        <section id="result-stage" class="stage-result" hidden>
          <div class="result-floating-bar">
            <span id="result-summary" class="result-summary-pill">Đang phân tích...</span>
            <div class="result-actions-cluster">
              <button id="btn-zoom-fit" class="floating-btn" title="Vừa khung">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <polyline points="9 21 3 21 3 15"></polyline>
                  <line x1="21" y1="3" x2="14" y2="10"></line>
                  <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
                <span>Vừa màn hình</span>
              </button>
              <button id="btn-download" class="floating-btn" title="Lưu ảnh">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>Lưu</span>
              </button>
              <button id="btn-retake" class="floating-btn" title="Quét tiếp">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="23 4 23 10 17 10"></polyline>
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                <span>Quét lại</span>
              </button>
            </div>
          </div>
          <canvas id="canvas-viewer"></canvas>
        </section>
      </main>

      <!-- 3. Bottom Dock (Fixed 76px) -->
      <footer class="bottom-dock">
        <button id="btn-load-model" class="btn-secondary" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Nạp model</span>
        </button>

        <button id="btn-capture" class="btn-primary" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span>Chụp ảnh</span>
        </button>

        <button id="btn-upload" class="btn-secondary" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>Thư viện</span>
        </button>

        <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
        <input id="file-input" type="file" accept="image/*" hidden>
      </footer>

      <!-- Settings Modal -->
      <div id="settings-modal" class="modal-backdrop" hidden>
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">Cấu hình CDN Mô hình</h2>
            <button id="btn-close-settings" class="icon-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <div class="form-group">
            <label class="form-label" for="provider-select">Nguồn CDN</label>
            <select id="provider-select" class="form-select">
              <option value="cloudflare_r2">Cloudflare R2</option>
              <option value="huggingface">Hugging Face</option>
              <option value="custom">Tùy biến URL</option>
            </select>
          </div>

          <div id="r2-group" class="form-group">
            <label class="form-label" for="r2-url-input">Cloudflare R2 Base URL</label>
            <input id="r2-url-input" class="form-input" type="text" placeholder="https://pub-xxxx.r2.dev/models">
          </div>

          <div id="hf-group" class="form-group">
            <label class="form-label" for="hf-url-input">Hugging Face Base URL</label>
            <input id="hf-url-input" class="form-input" type="text" placeholder="https://huggingface.co/<user>/<repo>/resolve/main/models">
          </div>

          <div id="custom-group" class="form-group">
            <label class="form-label" for="custom-url-input">Custom CDN Base URL</label>
            <input id="custom-url-input" class="form-input" type="text" placeholder="https://your-custom-cdn.com/models">
          </div>

          <div class="form-group">
            <label class="checkbox-row">
              <input id="dewarp-toggle" type="checkbox" checked>
              <span class="form-label" style="margin:0">Bật nắn phẳng L1 (UVDocNet)</span>
            </label>
          </div>

          <button id="btn-save-settings" class="btn-primary" type="button" style="width:100%">Lưu cấu hình</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
